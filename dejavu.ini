# Settings for Deja Vu. To keep yours when you update, copy this file to dejavu.user.ini
# next to the program: the game reads that one in place of this one.

[Features]
# Fix bugs in the original game. 0: exactly as the original. 1: fixed. It changes:
# - The check of the save files at the title, where one wrong byte in a save erases the whole
#   file, or hangs the game. Saves still work on emulators.
# - The capsule warp, where using the capsules on medicine you haven't taken breaks the room you
#   are in. Speedruns use this, and recorded runs that do won't play the same with it fixed.
FixBugs = 0

# Correct the original game's typos, grammar, punctuation and inconsistent spellings, in its
# messages and one item's name.
# 0: exactly as the original. 1: corrected. It has no effect on saves.
FixText = 0
