# ld65 configuration: iNES header, 8 PRG banks of 16 KB, 256 KB CHR ROM.
MEMORY {
    HEADER: start = $0000, size = $0010, fill = yes, file = %O;
    PRG0:   start = $8000, size = $4000, fill = yes, fillval = $FF, file = %O;
    PRG1:   start = $8000, size = $4000, fill = yes, fillval = $FF, file = %O;
    PRG2:   start = $8000, size = $4000, fill = yes, fillval = $FF, file = %O;
    PRG3:   start = $8000, size = $4000, fill = yes, fillval = $FF, file = %O;
    PRG4:   start = $8000, size = $4000, fill = yes, fillval = $FF, file = %O;
    PRG5:   start = $8000, size = $4000, fill = yes, fillval = $FF, file = %O;
    PRG6:   start = $8000, size = $4000, fill = yes, fillval = $FF, file = %O;
    PRG7:   start = $C000, size = $4000, fill = yes, fillval = $FF, file = %O;
    CHR:    start = $0000, size = $40000, fill = yes, file = %O;
}
SEGMENTS {
    HEADER: load = HEADER, type = ro;
    BANK0:  load = PRG0, type = ro;
    BANK1:  load = PRG1, type = ro;
    BANK2:  load = PRG2, type = ro;
    BANK3:  load = PRG3, type = ro;
    BANK4:  load = PRG4, type = ro;
    BANK5:  load = PRG5, type = ro;
    BANK6:  load = PRG6, type = ro;
    BANK7:  load = PRG7, type = ro;
    CHR:    load = CHR, type = ro;
}
